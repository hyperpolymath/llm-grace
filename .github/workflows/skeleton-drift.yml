# SPDX-License-Identifier: MPL-2.0
# skeleton-drift.yml — asserts this template's RSR required-files set is
# byte-identical to the canonical generator output in
# hyperpolymath/gitbot-fleet `robot-repo-automaton skeleton`.
#
# rsr-template-repo is DERIVED from that generator, not hand-maintained
# (hyperpolymath/rsr-template-repo#48; follow-up to #45/#47). Drift here —
# from either side — fails CI, so the template can never silently diverge
# from the canonical RSR contract. Regenerate with:
#   robot-repo-automaton skeleton emit .
name: Skeleton Drift

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: catches canonical changes that land in the generator
    # (gitbot-fleet) but have not yet been pulled into this template.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  skeleton-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout template (this repo)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Checkout generator (gitbot-fleet)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: hyperpolymath/gitbot-fleet
          path: .gitbot-fleet

      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the canonical skeleton generator
        run: |
          cargo build --release \
            --manifest-path .gitbot-fleet/robot-repo-automaton/Cargo.toml \
            --bin robot-repo-automaton

      - name: Assert template == canonical skeleton (drift fails)
        run: |
          BIN=.gitbot-fleet/robot-repo-automaton/target/release/robot-repo-automaton
          "$BIN" skeleton check "$GITHUB_WORKSPACE"
