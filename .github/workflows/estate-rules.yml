#
# Estate Rules — enforces hyperpolymath estate-wide conventions:
#   * root shape (allowlist of permitted root entries)
#   * AsciiDoc-by-default (no .md files under docs/)
#   * the V language is banned (no V scaffolding or references)
#   * neutral template (no project-specific identifiers — issue #45)
#
# Each rule is enforced by an executable check script under scripts/. Failures
# are surfaced as workflow errors so the rule can't silently regress.

name: Estate Rules

on:
  push:
    branches: [main]
  pull_request:
# Estate guardrail: cancel superseded runs so re-pushes don't pile up
# queued runs across the estate. Safe here because this workflow only
# performs read-only checks/lint/test/scan with no publish or mutation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  estate-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Root shape allowlist
        run: bash scripts/check-root-shape.sh .

      - name: AsciiDoc by default (no .md under docs/)
        run: bash scripts/check-no-md-in-docs.sh .


      - name: Neutral template (no project identifiers)
        run: bash scripts/check-no-project-identifiers.sh .

      - name: State required fields
        run: bash scripts/check-state.sh

      - name: Required workflow capabilities
        run: bash tests/workflows/validate_workflows_test.sh

      - name: Compliance guardrail regression tests
        run: bash tests/workflows/compliance_regression_test.sh

  core-tests:
    name: Zig core and LMDB crash tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install LMDB and pinned Zig distribution
        run: |
          sudo apt-get update
          sudo apt-get install --yes liblmdb-dev python3-venv
          python3 -m venv "$RUNNER_TEMP/grace-tools"
          "$RUNNER_TEMP/grace-tools/bin/pip" install ziglang==0.15.2
          ZIG_PATH=$("$RUNNER_TEMP/grace-tools/bin/python" -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / "zig")')
          ln -s "$ZIG_PATH" "$RUNNER_TEMP/grace-tools/bin/zig"
          echo "$RUNNER_TEMP/grace-tools/bin" >> "$GITHUB_PATH"
      - name: Run bounded core tests
        run: bash scripts/test-core.sh
      - name: Run optimized core tests
        run: bash scripts/test-core.sh -O ReleaseSafe
